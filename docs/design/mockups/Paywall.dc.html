<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Pro購入</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6E5C}a:hover{color:#0A4F42}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #1B1F1D; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column; padding: 50px 20px 34px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center; margin: 0 -8px">
<button aria-label="閉じる" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #E7EAE5; color: #1B1F1D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
<button onClick="{{restore}}" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #3A413D; font-family: inherit; font-size: 13px; font-weight: 500">購入を復元</button>
</div>

<div style="display: flex; align-items: center; gap: 14px">
<div style="flex-shrink: 0; width: 60px; height: 60px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 24px; font-weight: 700; line-height: 1.25">カウンター＋ Pro</span>
<span style="font-size: 13px; color: #4A524E">棚卸しの「最後の転記」までラクにする</span>
</div>
</div>

<sc-if value="{{showTeaser}}" hint-placeholder-val="{{ true }}">
<div style="padding: 12px 14px; border-radius: 14px; background: #E3F1EC; color: #0A4F42; display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
<span style="font-size: 13px; line-height: 1.5">これまでの履歴 <strong style="font-family: 'IBM Plex Mono', monospace">{{historyCount}}</strong> 件を記録中です。購入すると、すぐに見られます。</span>
</div>
</sc-if>

<div style="background: #FFFFFF; border: 1px solid #E3E6E1; border-radius: 16px; padding: 4px 0; display: flex; flex-direction: column">
<sc-for list="{{benefits}}" as="b" hint-placeholder-count="5">
<div style="min-height: 50px; padding: 6px 14px; display: flex; align-items: center; gap: 12px; background: {{b.bg}}">
<span style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px; background: {{b.iconBg}}; color: {{b.iconFg}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 14px; font-weight: 700">{{b.title}}</span>
<span style="font-size: 12px; color: #4A524E">{{b.desc}}</span>
</div>
</div>
</sc-for>
</div>

<div style="font-size: 12px; color: #59615D; text-align: center">無料版のまま使える機能：カウント・自動保存・項目数無制限</div>

<div style="flex-grow: 1"></div>

<sc-if value="{{notPurchased}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: center; gap: 8px">
<span style="font-size: 13px; font-weight: 500; color: #3A413D">買い切り</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600">{{price}}</span>
</div>
<div style="font-size: 12px; color: #59615D; text-align: center; margin-top: -6px">サブスクではありません。追加の支払いはありません。</div>
<button onClick="{{buy}}" style="height: 56px; border: 0; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">{{price}}でProにする</button>
</div>
</sc-if>
<sc-if value="{{purchased}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
<div style="width: 52px; height: 52px; border-radius: 26px; background: #E3F1EC; color: #0A4F42; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div>
<span style="font-size: 17px; font-weight: 700">Proになりました</span>
<span style="font-size: 13px; color: #4A524E">広告が消え、すべての機能が使えます</span>
<button onClick="{{undo}}" style="width: 100%; height: 56px; border: 0; border-radius: 16px; background: #1B1F1D; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">はじめる</button>
</div>
</sc-if>

<div style="display: flex; justify-content: center; gap: 16px; font-size: 12px">
<a href="#terms">利用規約</a>
<a href="#privacy">プライバシーポリシー</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6E5C","options":["#0F6E5C","#1F4FB8","#B4531F","#1B1F1D"]},"openedFrom":{"editor":"enum","options":["csv","history","category","ads"],"default":"csv"},"price":{"editor":"text","default":"¥800"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const from = this.props.openedFrom ?? 'csv';
    const accent = this.props.accent ?? '#0F6E5C';
    const list = [
      { key: 'csv', title: 'CSVで書き出し', desc: '数えた結果をそのままExcelへ。転記はもう不要' },
      { key: 'history', title: '履歴', desc: 'いつ・何を・いくつ数えたかを時刻つきで確認' },
      { key: 'category', title: 'カテゴリ無制限', desc: '棚・場所・売り場ごとに分けて数える' },
      { key: 'sort', title: '自動並べ替え', desc: '名前順・数の多い順・少ない順' },
      { key: 'ads', title: '広告を非表示', desc: '作業中に広告が出なくなる' }
    ];
    const benefits = list.map((b) => {
      const hot = b.key === from;
      return {
        title: b.title,
        desc: b.desc,
        bg: hot ? '#F0F7F4' : 'transparent',
        iconBg: hot ? accent : '#EEF0EC',
        iconFg: hot ? '#FFFFFF' : '#0F6E5C'
      };
    });
    const st = this.state || {};
    const purchased = !!st.purchased;
    return {
      accent: accent,
      price: this.props.price ?? '¥800',
      benefits: benefits,
      historyCount: 128,
      showTeaser: !purchased,
      purchased: purchased,
      notPurchased: !purchased,
      buy: () => this.setState({ purchased: true }),
      undo: () => this.setState({ purchased: false }),
      restore: () => this.setState({ purchased: true })
    };
  }
}
</script>
</body>
</html>
