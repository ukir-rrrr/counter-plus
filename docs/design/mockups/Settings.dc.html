<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6E5C}a:hover{color:#0A4F42}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #1B1F1D; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column; gap: 6px; overflow: hidden">

<div style="padding: 54px 10px 6px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="戻る" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #1B1F1D; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<span style="font-size: 17px; font-weight: 700">設定</span>
<span style="width: 44px"></span>
</div>

<sc-if value="{{showUpsell}}" hint-placeholder-val="{{ true }}">
<button style="margin: 0 16px 8px; padding: 14px 16px; border: 0; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 12px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 700">Proにする（買い切り ¥800）</span>
<span style="font-size: 12px; opacity: 0.9">広告なし・CSV出力・履歴・カテゴリ無制限</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-if>

<span style="padding: 0 32px; font-size: 12px; font-weight: 500; color: #59615D">カウント</span>
<div style="margin: 0 16px 8px; background: #FFFFFF; border: 1px solid #E3E6E1; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
<div style="min-height: 56px; padding: 0 14px; border-bottom: 1px solid #ECEEEA; display: flex; align-items: center; gap: 12px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px">{{t.label}}</span>
<span style="font-size: 11px; color: #646C68">{{t.desc}}</span>
</span>
<button onClick="{{t.flip}}" aria-pressed="{{t.on}}" aria-label="{{t.label}}" style="flex-shrink: 0; width: 52px; height: 32px; padding: 3px; border: 0; border-radius: 16px; background: {{t.track}}; display: flex; justify-content: {{t.align}}"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></button>
</div>
</sc-for>
</div>

<span style="padding: 0 32px; font-size: 12px; font-weight: 500; color: #59615D">購入</span>
<div style="margin: 0 16px 8px; background: #FFFFFF; border: 1px solid #E3E6E1; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
<button style="height: 52px; padding: 0 14px; border: 0; background: transparent; color: {{accent}}; font-family: inherit; font-size: 15px; text-align: left">購入を復元</button>
</div>

<span style="padding: 0 32px; font-size: 12px; font-weight: 500; color: #59615D">サポート</span>
<div style="margin: 0 16px 8px; background: #FFFFFF; border: 1px solid #E3E6E1; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{links}}" as="l" hint-placeholder-count="4">
<a href="{{l.href}}" style="height: 52px; padding: 0 14px; border-bottom: 1px solid #ECEEEA; color: #1B1F1D; text-decoration: none; font-size: 15px; display: flex; align-items: center; justify-content: space-between">{{l.label}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C948F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
</sc-for>
</div>

<div style="text-align: center; font-size: 12px; color: #646C68">カウンター＋ バージョン 1.0.0</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6E5C","options":["#0F6E5C","#1F4FB8","#B4531F","#1B1F1D"]},"isPro":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0F6E5C';
    const st = this.state || {};
    const defs = [
      { key: 'haptics', label: 'タップ時の振動', desc: '＋・−を押したときに軽く振動', def: true },
      { key: 'awake', label: '画面を消さない', desc: '数えている間は画面を点けたまま', def: true }
    ];
    const toggles = defs.map((d) => {
      const on = st[d.key] ?? d.def;
      return {
        label: d.label,
        desc: d.desc,
        on: on ? 'true' : 'false',
        track: on ? accent : '#C9CEC8',
        align: on ? 'flex-end' : 'flex-start',
        flip: () => this.setState({ [d.key]: !on })
      };
    });
    const links = [
      { label: 'App Storeでレビューを書く', href: '#review' },
      { label: 'お問い合わせ', href: '#contact' },
      { label: '利用規約', href: '#terms' },
      { label: 'プライバシーポリシー', href: '#privacy' }
    ];
    return {
      accent: accent,
      toggles: toggles,
      links: links,
      showUpsell: !(this.props.isPro ?? false)
    };
  }
}
</script>
</body>
</html>
