<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>項目の編集</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6E5C}a:hover{color:#0A4F42}
button{cursor:pointer}
input:focus{outline:2px solid #0F6E5C;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #7A807C; color: #1B1F1D; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">

<div style="flex-grow: 1; padding: 64px 26px 0; display: flex; flex-direction: column; gap: 8px; opacity: 0.35">
<div style="height: 44px; border-radius: 12px; background: #FFFFFF"></div>
</div>

<div style="background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 8px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #D0D4CF"></div>

<div style="display: flex; align-items: center; justify-content: space-between; margin-top: -4px">
<span style="width: 64px"></span>
<span style="font-size: 16px; font-weight: 700">項目を編集</span>
<button style="width: 64px; height: 44px; border: 0; background: transparent; color: {{accent}}; font-family: inherit; font-size: 15px; font-weight: 700; text-align: right; padding: 0">完了</button>
</div>

<div style="background: #F4F5F2; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button onClick="{{dec1}}" aria-label="1減らす" style="width: 56px; height: 56px; border: 0; border-radius: 14px; background: #FFFFFF; color: #1B1F1D; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center">
<span style="font-size: 11px; color: #59615D">現在の数（タップで直接入力）</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 44px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums">{{count}}</span>
</div>
<button onClick="{{inc1}}" aria-label="1増やす" style="width: 56px; height: 56px; border: 0; border-radius: 14px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<button onClick="{{s.apply}}" style="height: 44px; border: 1px solid #DDE1DB; border-radius: 12px; background: #FFFFFF; color: #1B1F1D; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500">{{s.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="item-name" style="font-size: 12px; font-weight: 500; color: #59615D">項目名</label>
<input id="item-name" value="{{name}}" onChange="{{onName}}" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #DDE1DB; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #1B1F1D">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="item-memo" style="font-size: 12px; font-weight: 500; color: #59615D">メモ（置き場所など）</label>
<input id="item-memo" value="{{memo}}" onChange="{{onMemo}}" placeholder="例：棚上段" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #DDE1DB; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #1B1F1D">
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 500; color: #59615D">色</span>
<div style="display: flex; gap: 12px; padding-left: 2px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.pick}}" aria-label="{{c.label}}" style="width: 36px; height: 36px; margin: 4px 0; border: 0; border-radius: 18px; background: {{c.hex}}; box-shadow: {{c.ring}}"></button>
</sc-for>
</div>
</div>

<button style="height: 48px; padding: 0 14px; border: 1px solid #DDE1DB; border-radius: 12px; background: #FFFFFF; color: #1B1F1D; font-family: inherit; font-size: 15px; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 12px; font-weight: 500; color: #59615D">カテゴリ</span><span style="display: flex; align-items: center; gap: 4px">棚 A<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C948F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span></button>

<div style="display: flex; gap: 8px">
<button onClick="{{reset}}" style="flex: 1; height: 48px; border: 1px solid #DDE1DB; border-radius: 12px; background: #FFFFFF; color: #1B1F1D; font-family: inherit; font-size: 14px; font-weight: 500">数を0にリセット</button>
<button style="flex: 1; height: 48px; border: 1px solid #F1C9C4; border-radius: 12px; background: #FFF6F5; color: #B42318; font-family: inherit; font-size: 14px; font-weight: 500">この項目を削除</button>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #59615D"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F6E5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>変更はその場で自動保存されます</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6E5C","options":["#0F6E5C","#1F4FB8","#B4531F","#1B1F1D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  palette() {
    return [
      { hex: '#3E7CB1', label: '青' },
      { hex: '#3F9A6E', label: '緑' },
      { hex: '#C9772E', label: 'オレンジ' },
      { hex: '#9A5BB0', label: '紫' },
      { hex: '#C2414B', label: '赤' },
      { hex: '#6B726E', label: 'グレー' }
    ];
  }
  s() {
    const st = this.state || {};
    return {
      count: st.count ?? 24,
      name: st.name ?? 'マグカップ 白',
      memo: st.memo ?? '棚上段',
      color: st.color ?? '#3E7CB1'
    };
  }
  add(d) {
    this.setState((p) => ({ count: Math.max(0, ((p && p.count) ?? 24) + d) }));
  }
  renderVals() {
    const cur = this.s();
    const steps = [-10, -5, 5, 10].map((n) => ({
      label: (n > 0 ? '+' : '−') + Math.abs(n),
      apply: () => this.add(n)
    }));
    const colors = this.palette().map((c) => ({
      hex: c.hex,
      label: '色：' + c.label,
      ring: c.hex === cur.color ? '0 0 0 3px #FFFFFF, 0 0 0 5px #1B1F1D' : 'none',
      pick: () => this.setState({ color: c.hex })
    }));
    return {
      count: cur.count,
      name: cur.name,
      memo: cur.memo,
      steps: steps,
      colors: colors,
      inc1: () => this.add(1),
      dec1: () => this.add(-1),
      reset: () => this.setState({ count: 0 }),
      onName: (e) => this.setState({ name: e.target.value }),
      onMemo: (e) => this.setState({ memo: e.target.value }),
      accent: this.props.accent ?? '#0F6E5C'
    };
  }
}
</script>
</body>
</html>
