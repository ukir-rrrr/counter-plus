<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>カテゴリ一覧</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6E5C}a:hover{color:#0A4F42}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #1B1F1D; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 54px 10px 6px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="閉じる" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #1B1F1D; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
<span style="font-size: 17px; font-weight: 700">カテゴリ</span>
<button style="width: 56px; height: 44px; border: 0; background: transparent; color: {{accent}}; font-family: inherit; font-size: 15px; font-weight: 500">編集</button>
</div>

<div style="margin: 4px 16px 14px; padding: 14px 18px; background: #FFFFFF; border: 1px solid #E3E6E1; border-radius: 16px; display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #59615D">すべてのカテゴリの合計</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600; line-height: 1.1">{{grand}}</span>
</div>
<span style="font-size: 12px; color: #59615D">{{catCount}} カテゴリ</span>
</div>

<div style="margin: 0 16px; background: #FFFFFF; border: 1px solid #E3E6E1; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.pick}}" style="min-height: 64px; padding: 0 14px; border: 0; border-bottom: 1px solid #ECEEEA; background: {{c.bg}}; color: #1B1F1D; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 12px">
<span style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; background: #EEF0EC; color: #3A413D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v5H4z"></path><path d="M4 14h16v5H4z"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 15px; font-weight: 700">{{c.name}}</span>
<span style="font-size: 12px; color: #59615D">{{c.items}} 項目</span>
</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">{{c.total}}</span>
<span style="width: 22px; display: flex; justify-content: center; color: {{accent}}"><sc-if value="{{c.selected}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if></span>
</button>
</sc-for>
<button style="height: 56px; border: 0; background: transparent; color: {{accent}}; font-family: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>カテゴリを追加<sc-if value="{{locked}}" hint-placeholder-val="{{ true }}"><span style="padding: 1px 5px; border-radius: 4px; background: {{accent}}; color: #FFFFFF; font-size: 9px; font-weight: 700; letter-spacing: 0.04em">PRO</span></sc-if></button>
</div>

<sc-if value="{{locked}}" hint-placeholder-val="{{ true }}">
<div style="margin: 12px 16px 0; padding: 12px 14px; border-radius: 14px; background: #E3F1EC; color: #0A4F42; font-size: 13px; line-height: 1.6">無料版のカテゴリは1つまでです。Proにすると、棚・場所・売り場ごとにいくつでも分けられます。</div>
</sc-if>

<div style="padding: 12px 16px 0; text-align: center; font-size: 11px; color: #646C68">長押しで名前の変更・並べ替え・削除</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6E5C","options":["#0F6E5C","#1F4FB8","#B4531F","#1B1F1D"]},"isPro":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pro = this.props.isPro ?? true;
    const all = [
      { name: '棚 A', items: 7, total: 187 },
      { name: '棚 B', items: 5, total: 92 },
      { name: 'バックヤード', items: 12, total: 340 },
      { name: 'レジまわり', items: 4, total: 41 }
    ];
    const list = pro ? all : all.slice(0, 1);
    const sel = (this.state && this.state.sel) || 0;
    const cats = list.map((c, i) => ({
      name: c.name,
      items: c.items,
      total: c.total,
      selected: i === sel,
      bg: i === sel ? '#F0F7F4' : 'transparent',
      pick: () => this.setState({ sel: i })
    }));
    return {
      accent: this.props.accent ?? '#0F6E5C',
      cats: cats,
      grand: list.reduce((a, c) => a + c.total, 0),
      catCount: list.length,
      locked: !pro
    };
  }
}
</script>
</body>
</html>
