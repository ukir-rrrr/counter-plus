<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム（2列グリッド）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6E5C}a:hover{color:#0A4F42}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #1B1F1D; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 54px 10px 6px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="カテゴリ一覧" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #1B1F1D; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h10"></path></svg>
</button>
<button aria-label="カテゴリを切り替え" style="height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: #1B1F1D; font-family: inherit; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 4px">棚 A<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
<button aria-label="設定" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #1B1F1D; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
</button>
</div>

<div style="margin: 4px 16px 12px; padding: 14px 18px; background: #FFFFFF; border: 1px solid #E3E6E1; border-radius: 16px; display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #59615D">合計</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 34px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums">{{total}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: #E3F1EC; color: #0A4F42; font-size: 11px; font-weight: 500"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>自動保存済み</span>
<span style="font-size: 12px; color: #59615D">{{itemCount}} 項目</span>
</div>
</div>

<div style="flex-grow: 1; padding: 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-content: start; overflow: hidden">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<div style="background: #FFFFFF; border: 1px solid #E3E6E1; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden">
<button onClick="{{item.inc}}" aria-label="{{item.incLabel}}" style="border: 0; background: transparent; padding: 12px 14px 4px; text-align: left; display: flex; flex-direction: column; gap: 8px; color: inherit; font-family: inherit; min-height: 84px">
<span style="display: flex; align-items: center; gap: 6px; width: 100%; font-size: 13px; font-weight: 500; color: #3A413D"><span style="flex-shrink: 0; width: 8px; height: 8px; border-radius: 4px; background: {{item.color}}"></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.name}}</span></span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 36px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums">{{item.count}}</span>
</button>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px 6px 14px">
<span style="font-size: 11px; color: #646C68; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.memo}}</span>
<button onClick="{{item.dec}}" aria-label="{{item.decLabel}}" style="flex-shrink: 0; width: 44px; height: 44px; border: 0; border-radius: 12px; background: #EEF0EC; color: #1B1F1D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
</div>
</div>
</sc-for>
<button style="min-height: 134px; border: 1.5px dashed #A9B3AE; border-radius: 16px; background: transparent; color: {{accent}}; font-family: inherit; font-size: 14px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>項目を追加</button>
</div>

<div style="padding: 8px 16px 0; text-align: center; font-size: 11px; color: #646C68">カードをタップで＋1　長押しで編集・並べ替え</div>

<div style="padding: 10px 16px 12px; display: flex; gap: 8px">
<button style="flex: 1; height: 44px; border: 1px solid #E3E6E1; border-radius: 12px; background: #FFFFFF; color: #1B1F1D; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>履歴<span style="padding: 1px 5px; border-radius: 4px; background: {{accent}}; color: #FFFFFF; font-size: 9px; font-weight: 700; letter-spacing: 0.04em">PRO</span></button>
<button style="flex: 1; height: 44px; border: 1px solid #E3E6E1; border-radius: 12px; background: #FFFFFF; color: #1B1F1D; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7.5 10.5L12 15l4.5-4.5"></path><path d="M5 19h14"></path></svg>CSV出力<span style="padding: 1px 5px; border-radius: 4px; background: {{accent}}; color: #FFFFFF; font-size: 9px; font-weight: 700; letter-spacing: 0.04em">PRO</span></button>
<button aria-label="並べ替え" style="width: 44px; height: 44px; border: 1px solid #E3E6E1; border-radius: 12px; background: #FFFFFF; color: #1B1F1D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16"></path><path d="M3.5 16.5L7 20l3.5-3.5"></path><path d="M17 20V4"></path><path d="M13.5 7.5L17 4l3.5 3.5"></path></svg></button>
</div>

<sc-if value="{{showAd}}" hint-placeholder-val="{{ true }}">
<div style="height: 60px; background: #E4E7E2; border-top: 1px solid #D5D9D3; display: flex; align-items: center; justify-content: center; gap: 8px; color: #59615D; font-size: 12px"><span style="padding: 1px 5px; border: 1px solid #8C948F; border-radius: 3px; font-size: 10px">広告</span>バナー広告（AdMob）</div>
</sc-if>
<div style="height: 34px; flex-shrink: 0"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6E5C","options":["#0F6E5C","#1F4FB8","#B4531F","#1B1F1D"]},"showAd":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  base() {
    return [
      { name: 'マグカップ 白', memo: '棚上段', count: 24, color: '#3E7CB1' },
      { name: 'マグカップ 黒', memo: '棚上段', count: 18, color: '#3E7CB1' },
      { name: 'トートバッグ', memo: 'フック', count: 12, color: '#C9772E' },
      { name: 'ハンドタオル', memo: '引き出し', count: 37, color: '#3F9A6E' },
      { name: 'アロマキャンドル', memo: 'レジ横', count: 9, color: '#9A5BB0' }
    ];
  }
  counts() {
    const s = this.state || {};
    return s.counts || this.base().map((b) => b.count);
  }
  change(i, d) {
    this.setState((s) => {
      const c = ((s && s.counts) || this.base().map((b) => b.count)).slice();
      c[i] = Math.max(0, c[i] + d);
      return { counts: c };
    });
  }
  renderVals() {
    const counts = this.counts();
    const items = this.base().map((b, i) => ({
      name: b.name,
      memo: b.memo,
      color: b.color,
      count: counts[i],
      inc: () => this.change(i, 1),
      dec: () => this.change(i, -1),
      incLabel: b.name + 'を1増やす',
      decLabel: b.name + 'を1減らす'
    }));
    return {
      items: items,
      total: counts.reduce((a, b) => a + b, 0),
      itemCount: items.length,
      accent: this.props.accent ?? '#0F6E5C',
      showAd: this.props.showAd ?? true
    };
  }
}
</script>
</body>
</html>
